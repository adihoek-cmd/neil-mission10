<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>משימה סודית לניל</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="style.css?v=3">
  
</head>
<body class="">

<div class="wrap">
  <div class="card">
    <div class="topbar">
      <div class="pill">⏱️ <strong>טיימר</strong> <span id="timer">0:00</span></div>
      <div class="pill">⚠️ <strong>קנסות</strong> <span id="penalty">0s</span></div>
      <div class="pill">❌ <strong>טעויות</strong> <span id="wrongs">0</span></div>
    </div>
      <div class="pill" style="display:none" id="debugStore"></div>

    <h1>ניל שלום, הלילה נגנב מכשיר משוכלל מהמעבדות של אקספנג</h1>
    <p>
      אנחנו צריכים את עזרתך לפענח את כתב החידה שהשאירו החייזרים.<br>
      בקרוב תקבל קוד סודי שיאפשר לך להתקדם לחידה הבאה.
    </p>

    <div class="row">
      <input class="code" type="text" id="code" inputmode="numeric" maxlength="6" placeholder="הכנס קוד בן 6 ספרות">
      <button onclick="checkCode('676767','riddle1.html')">אישור</button>
      </div>

    <p class="small" style="margin-top:14px;">
      טיפ: אם לא שומעים צליל—לחץ שוב על “צליל פתיחה” (דפדפנים לפעמים חוסמים אוטומטית).
    </p>
  </div>
</div>

<script>initHUD();</script>

<script src="script.js?v=3"></script>

</body>
</html>
